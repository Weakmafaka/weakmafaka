<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Daniil — Backend and GameDev</title>
  <desc id="description">Dark portfolio banner with violet and cyan accents</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#160B2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1010" cy="140" r="230" fill="url(#glow)"/>
  <path d="M0 252C222 187 351 296 591 231C821 169 992 217 1200 119V300H0Z" fill="#7C3AED" fill-opacity="0.08"/>
  <path d="M0 267C245 205 382 301 612 247C840 193 1021 221 1200 150" fill="none" stroke="url(#accent)" stroke-opacity="0.46" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="190" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="84" cy="73" r="5" fill="#22D3EE"/>
    <text x="99" y="79" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">BUILDING IN PUBLIC</text>

    <text x="62" y="153" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1">DANIIL</text>
    <text x="62" y="198" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="3">BACKEND → GAMEDEV</text>
    <text x="64" y="239" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="17" letter-spacing="1">systems • automation • multiplayer worlds</text>
  </g>

  <path d="M1009 59L1103 111V216L1009 268L915 216V111Z" fill="#0F172A" stroke="url(#accent)" stroke-width="3"/>
  <path d="M1009 59V163M915 111L1009 163L1103 111M1009 163V268" fill="none" stroke="url(#accent)" stroke-opacity="0.75" stroke-width="2"/>
  <circle cx="1009" cy="163" r="25" fill="#7C3AED" fill-opacity="0.22" stroke="#22D3EE" stroke-width="2"/>
  <path d="M997 163H1021M1009 151V175" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>

  <rect x="1.5" y="1.5" width="1197" height="297" rx="20.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>
</svg>
